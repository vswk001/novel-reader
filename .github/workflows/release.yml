name: Release

on:
  push:
    tags: ['v*']
  # 手动触发：只构建并验证签名，不创建 Release
  workflow_dispatch:

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > moyue-release.keystore
          {
            echo "storeFile=moyue-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests & signed release build
        env:
          UPDATE_FEED_URL: https://api.github.com/repos/vswk001/novel-reader/releases/latest
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PupdateFeedUrl="$UPDATE_FEED_URL" --stacktrace

      - name: Verify signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "MoYue-${GITHUB_REF_NAME}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoYue-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MoYue-${GITHUB_REF_NAME}-release.apk" --generate-notes
